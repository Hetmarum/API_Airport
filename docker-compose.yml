services:
  airport:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "until pg_isready -h db -p 5432; do sleep 1; done &&
         python manage.py migrate &&
         python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "db", "-p", "5432" ]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  postgres_db:
