services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c "python manage.py migrate && \
      python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "db", "-p", "5432" ]
      interval: 2s
      timeout: 3s
      retries: 5
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_db:/var/lib/postgresql/data

volumes:
  postgres_db:
